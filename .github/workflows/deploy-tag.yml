name: Deploy Tagged Report Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/aandi-report-server' }}
      MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'aandi' }}
      SWAGGER_URL: ${{ vars.SWAGGER_URL || 'http://localhost:8080' }}
      AUTH_ISSUER_URI: ${{ vars.AUTH_ISSUER_URI || 'https://auth.aandiclub.com' }}
      AUTH_SERVICE_BASE_URL: ${{ vars.AUTH_SERVICE_BASE_URL || 'https://api.aandiclub.com' }}
      AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE || 'aandiclub-api' }}
      AUTH_JWT_CLOCK_SKEW_SECONDS: ${{ vars.AUTH_JWT_CLOCK_SKEW_SECONDS || '30' }}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ vars.APP_CORS_ALLOWED_ORIGIN_PATTERNS || '' }}
      ONLINE_JUDGE_BASE_URL: ${{ vars.ONLINE_JUDGE_BASE_URL || 'http://localhost:8081' }}
      APP_EVENTS_REPORT_TEST_CASE_ENABLED: ${{ vars.APP_EVENTS_REPORT_TEST_CASE_ENABLED || 'false' }}
      APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN: ${{ vars.APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN || '' }}
      APP_EVENTS_REPORT_TEST_CASE_REGION: ${{ vars.APP_EVENTS_REPORT_TEST_CASE_REGION || 'ap-northeast-2' }}
      APP_EVENTS_USER_SYNC_ENABLED: ${{ vars.APP_EVENTS_USER_SYNC_ENABLED || 'false' }}
      APP_EVENTS_USER_SYNC_QUEUE_URL: ${{ vars.APP_EVENTS_USER_SYNC_QUEUE_URL || '' }}
      APP_EVENTS_USER_SYNC_REGION: ${{ vars.APP_EVENTS_USER_SYNC_REGION || 'ap-northeast-2' }}
      APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS: ${{ vars.APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS || '20' }}
      APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES: ${{ vars.APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES || '10' }}
      REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED: ${{ vars.REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED || 'false' }}
      REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL: ${{ vars.REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL || '' }}
      REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS: ${{ vars.REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS || '20' }}
      REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES: ${{ vars.REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES || '10' }}
      REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS: ${{ vars.REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS || '60' }}
      APP_REPORT_V2_SALT_SECRET: ${{ secrets.APP_REPORT_V2_SALT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build bootJar
        run: ./gradlew clean bootJar --no-daemon

      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: ${GITHUB_REF_NAME}"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
        run: |
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Deploy on instance via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          APP_DIR: ${{ env.APP_DIR }}
          MONGO_DB_NAME: ${{ env.MONGO_DB_NAME }}
          SWAGGER_URL: ${{ env.SWAGGER_URL }}
          AUTH_ISSUER_URI: ${{ env.AUTH_ISSUER_URI }}
          AUTH_SERVICE_BASE_URL: ${{ env.AUTH_SERVICE_BASE_URL }}
          AUTH_AUDIENCE: ${{ env.AUTH_AUDIENCE }}
          AUTH_JWT_CLOCK_SKEW_SECONDS: ${{ env.AUTH_JWT_CLOCK_SKEW_SECONDS }}
          APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ env.APP_CORS_ALLOWED_ORIGIN_PATTERNS }}
          ONLINE_JUDGE_BASE_URL: ${{ env.ONLINE_JUDGE_BASE_URL }}
          APP_EVENTS_REPORT_TEST_CASE_ENABLED: ${{ env.APP_EVENTS_REPORT_TEST_CASE_ENABLED }}
          APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN: ${{ env.APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN }}
          APP_EVENTS_REPORT_TEST_CASE_REGION: ${{ env.APP_EVENTS_REPORT_TEST_CASE_REGION }}
          APP_EVENTS_USER_SYNC_ENABLED: ${{ env.APP_EVENTS_USER_SYNC_ENABLED }}
          APP_EVENTS_USER_SYNC_QUEUE_URL: ${{ env.APP_EVENTS_USER_SYNC_QUEUE_URL }}
          APP_EVENTS_USER_SYNC_REGION: ${{ env.APP_EVENTS_USER_SYNC_REGION }}
          APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS: ${{ env.APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS }}
          APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES: ${{ env.APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES }}
          REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED: ${{ env.REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED }}
          REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL: ${{ env.REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL }}
          REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS: ${{ env.REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS }}
          REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES: ${{ env.REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES }}
          REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS: ${{ env.REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS }}
          APP_REPORT_V2_SALT_SECRET: ${{ env.APP_REPORT_V2_SALT_SECRET }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || '22' }}
          envs: AWS_REGION,IMAGE_URI,APP_DIR,MONGO_DB_NAME,SWAGGER_URL,AUTH_ISSUER_URI,AUTH_SERVICE_BASE_URL,AUTH_AUDIENCE,AUTH_JWT_CLOCK_SKEW_SECONDS,APP_CORS_ALLOWED_ORIGIN_PATTERNS,ONLINE_JUDGE_BASE_URL,APP_EVENTS_REPORT_TEST_CASE_ENABLED,APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN,APP_EVENTS_REPORT_TEST_CASE_REGION,APP_EVENTS_USER_SYNC_ENABLED,APP_EVENTS_USER_SYNC_QUEUE_URL,APP_EVENTS_USER_SYNC_REGION,APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS,APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES,REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED,REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL,REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS,REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES,REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS,APP_REPORT_V2_SALT_SECRET,AUTH_JWT_SECRET
          script: |
            set -euo pipefail

            for v in AUTH_ISSUER_URI AUTH_AUDIENCE AUTH_JWT_SECRET; do
              eval "val=\${$v:-}"
              if [ -z "${val}" ]; then
                echo "Missing required env: ${v}"
                exit 1
              fi
            done
            if [ "${#AUTH_JWT_SECRET}" -lt 32 ]; then
              echo "AUTH_JWT_SECRET must be at least 32 chars"
              exit 1
            fi
            if [ "${APP_EVENTS_REPORT_TEST_CASE_ENABLED}" = "true" ] && [ -z "${APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN:-}" ]; then
              echo "APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN must not be blank when APP_EVENTS_REPORT_TEST_CASE_ENABLED=true"
              exit 1
            fi
            if [ "${APP_EVENTS_USER_SYNC_ENABLED}" = "true" ] && [ -z "${APP_EVENTS_USER_SYNC_QUEUE_URL:-}" ]; then
              echo "APP_EVENTS_USER_SYNC_QUEUE_URL must not be blank when APP_EVENTS_USER_SYNC_ENABLED=true"
              exit 1
            fi
            if [ "${REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED}" = "true" ] && [ -z "${REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL:-}" ]; then
              echo "REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL must not be blank when REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED=true"
              exit 1
            fi
            if [ "${REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED}" = "true" ] && [ -z "${AWS_REGION:-}" ]; then
              echo "AWS_REGION must not be blank when REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED=true"
              exit 1
            fi

            ECR_REGISTRY="$(echo "${IMAGE_URI}" | cut -d'/' -f1)"

            aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            mkdir -p "${APP_DIR}"
            cat > "${APP_DIR}/.env.runtime" <<EOF
            IMAGE_URI=${IMAGE_URI}
            AWS_REGION=${AWS_REGION}
            MONGO_DB_NAME=${MONGO_DB_NAME}
            SWAGGER_URL=${SWAGGER_URL}
            AUTH_ISSUER_URI=${AUTH_ISSUER_URI}
            AUTH_SERVICE_BASE_URL=${AUTH_SERVICE_BASE_URL}
            AUTH_AUDIENCE=${AUTH_AUDIENCE}
            AUTH_JWT_CLOCK_SKEW_SECONDS=${AUTH_JWT_CLOCK_SKEW_SECONDS}
            APP_CORS_ALLOWED_ORIGIN_PATTERNS=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
            ONLINE_JUDGE_BASE_URL=${ONLINE_JUDGE_BASE_URL}
            APP_EVENTS_REPORT_TEST_CASE_ENABLED=${APP_EVENTS_REPORT_TEST_CASE_ENABLED}
            APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN=${APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN}
            APP_EVENTS_REPORT_TEST_CASE_REGION=${APP_EVENTS_REPORT_TEST_CASE_REGION}
            APP_EVENTS_USER_SYNC_ENABLED=${APP_EVENTS_USER_SYNC_ENABLED}
            APP_EVENTS_USER_SYNC_QUEUE_URL=${APP_EVENTS_USER_SYNC_QUEUE_URL}
            APP_EVENTS_USER_SYNC_REGION=${APP_EVENTS_USER_SYNC_REGION}
            APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS=${APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS}
            APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES=${APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES}
            REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED=${REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED}
            REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL=${REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL}
            REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS=${REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS}
            REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES=${REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES}
            REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS=${REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS}
            APP_REPORT_V2_SALT_SECRET=${APP_REPORT_V2_SALT_SECRET}
            AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
            EOF

            # Use an unquoted EOF so the compose file is rendered with the runtime env values.
            cat <<EOF > "${APP_DIR}/docker-compose.yml"
            services:
              mongodb:
                image: mongo:7
                container_name: aandi-report-mongodb
                restart: always
                volumes:
                  - mongo_data:/data/db
                healthcheck:
                  test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              report-server:
                image: ${IMAGE_URI}
                container_name: aandi-report-server
                restart: always
                depends_on:
                  mongodb:
                    condition: service_healthy
                ports:
                  - "8080:8080"
                environment:
                  SPRING_PROFILES_ACTIVE: prod
                  AWS_REGION: ${AWS_REGION}
                  MONGO_DB_URL: mongodb://mongodb:27017/${MONGO_DB_NAME}
                  SWAGGER_URL: ${SWAGGER_URL}
                  AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
                  AUTH_SERVICE_BASE_URL: ${AUTH_SERVICE_BASE_URL}
                  AUTH_AUDIENCE: ${AUTH_AUDIENCE}
                  AUTH_JWT_CLOCK_SKEW_SECONDS: ${AUTH_JWT_CLOCK_SKEW_SECONDS}
                  APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
                  ONLINE_JUDGE_BASE_URL: ${ONLINE_JUDGE_BASE_URL}
                  APP_EVENTS_REPORT_TEST_CASE_ENABLED: ${APP_EVENTS_REPORT_TEST_CASE_ENABLED}
                  APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN: ${APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN}
                  APP_EVENTS_REPORT_TEST_CASE_REGION: ${APP_EVENTS_REPORT_TEST_CASE_REGION}
                  APP_EVENTS_USER_SYNC_ENABLED: ${APP_EVENTS_USER_SYNC_ENABLED}
                  APP_EVENTS_USER_SYNC_QUEUE_URL: ${APP_EVENTS_USER_SYNC_QUEUE_URL}
                  APP_EVENTS_USER_SYNC_REGION: ${APP_EVENTS_USER_SYNC_REGION}
                  APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS: ${APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS}
                  APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES: ${APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES}
                  REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED: ${REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED}
                  REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL: ${REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL}
                  REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS: ${REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS}
                  REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES: ${REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES}
                  REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS: ${REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS}
                  APP_REPORT_V2_SALT_SECRET: ${APP_REPORT_V2_SALT_SECRET}
                  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}

            volumes:
              mongo_data:
            EOF

            cd "${APP_DIR}"
            docker compose --env-file .env.runtime pull
            docker compose --env-file .env.runtime up -d --remove-orphans

            docker exec aandi-report-server sh -lc \
              'echo "AUTH_JWT_SECRET_LEN=$(echo -n "${AUTH_JWT_SECRET:-}" | wc -c)"; echo "APP_REPORT_V2_SALT_SECRET_LEN=$(echo -n "${APP_REPORT_V2_SALT_SECRET:-}" | wc -c)"; env | egrep "AWS_REGION|AUTH_ISSUER_URI|AUTH_SERVICE_BASE_URL|AUTH_AUDIENCE|AUTH_JWT_CLOCK_SKEW_SECONDS|APP_CORS_ALLOWED_ORIGIN_PATTERNS|ONLINE_JUDGE_BASE_URL|APP_EVENTS_REPORT_TEST_CASE_ENABLED|APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN|APP_EVENTS_REPORT_TEST_CASE_REGION|APP_EVENTS_USER_SYNC_ENABLED|APP_EVENTS_USER_SYNC_QUEUE_URL|APP_EVENTS_USER_SYNC_REGION|APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS|APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES|REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED|REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL|REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS|REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES|REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS"'

            rm -f "${APP_DIR}/.env.runtime"

            docker image prune -f --filter "until=72h"
