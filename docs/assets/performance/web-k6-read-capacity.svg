<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">A&amp;I WEB Server k6 읽기 API 부하 테스트</title>
  <desc id="desc">초당 100건의 읽기 요청을 2분 동안 처리해 약 12000건을 검증했다. HTTP 실패율과 dropped iteration, private testcase 노출은 모두 0이며, 과제 목록 P95는 6.559밀리초, 상세 P95는 3.088밀리초다.</desc>

  <rect width="1280" height="720" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2563EB"/>

  <text x="72" y="65"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="13" font-weight="800" letter-spacing="1.3"
        fill="#2563EB">K6 LOAD TEST · READ API</text>
  <text x="72" y="115"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="40" font-weight="760" letter-spacing="-1.4"
        fill="#0F172A">초당 100건을 2분 동안 안정적으로 처리했습니다</text>
  <text x="72" y="151"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="17" fill="#475569">과제 목록과 상세 조회를 60:40 비율로 섞어 반복한 로컬 회귀 테스트입니다.</text>

  <rect x="72" y="190" width="1136" height="176" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="104" y="230"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="12" font-weight="800" letter-spacing="0.8"
        fill="#64748B">검증한 읽기 요청량</text>
  <text x="104" y="304"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="58" font-weight="800" letter-spacing="-2"
        fill="#0F172A">100 req/s</text>
  <text x="419" y="304"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="25" font-weight="650" fill="#475569">× 2분 = 약 12,000건</text>

  <rect x="780" y="232" width="126" height="40" rx="20" fill="#DCFCE7"/>
  <text x="843" y="257" text-anchor="middle"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="12" font-weight="800" fill="#059669">실패 0%</text>
  <rect x="918" y="232" width="126" height="40" rx="20" fill="#DBEAFE"/>
  <text x="981" y="257" text-anchor="middle"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="12" font-weight="800" fill="#1D4ED8">CHECK 100%</text>
  <rect x="1056" y="232" width="120" height="40" rx="20" fill="#DCFCE7"/>
  <text x="1116" y="257" text-anchor="middle"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="12" font-weight="800" fill="#059669">노출 0건</text>
  <text x="780" y="314"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="14" fill="#64748B">Dropped iterations 0 · private testcase 0</text>

  <rect x="72" y="398" width="552" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="104" y="440"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="12" font-weight="800" letter-spacing="0.8"
        fill="#64748B">과제 목록 · P95</text>
  <text x="104" y="514"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1.8"
        fill="#0F172A">6.559 ms</text>
  <rect x="104" y="552" width="488" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="104" y="552" width="458" height="12" rx="6" fill="#2563EB"/>
  <text x="104" y="589"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="14" fill="#475569">요청 100건 중 95건이 이 시간 안에 응답</text>

  <rect x="656" y="398" width="552" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="688" y="440"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="12" font-weight="800" letter-spacing="0.8"
        fill="#64748B">과제 상세 · P95</text>
  <text x="688" y="514"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1.8"
        fill="#0F172A">3.088 ms</text>
  <rect x="688" y="552" width="488" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="688" y="552" width="229" height="12" rx="6" fill="#38BDF8"/>
  <text x="688" y="589"
        font-family="Inter, Pretendard, 'Noto Sans KR', system-ui, sans-serif"
        font-size="14" fill="#475569">요청 100건 중 95건이 이 시간 안에 응답</text>

  <line x1="72" y1="655" x2="1208" y2="655" stroke="#CBD5E1"/>
  <text x="72" y="685"
        font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
        font-size="11.5" fill="#64748B">fixture: assignments 30 · students 100 · projections 60</text>
  <text x="1208" y="685" text-anchor="end"
        font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
        font-size="11.5" fill="#64748B">k6 v0.52.0 · 3 runs median · local single machine</text>
</svg>
