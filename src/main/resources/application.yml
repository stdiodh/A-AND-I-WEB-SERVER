spring:
  application:
    name: aandi_post_web_server
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul

  data:
    mongodb:
      uri: ${MONGO_DB_URL:mongodb://localhost:27017/aandi}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    urls:
      - name: report-service-v1
        url: /v3/api-docs/report-v1
      - name: report-service-v2
        url: /v3/api-docs/report-v2

swagger:
  server:
    url: ${SWAGGER_URL:https://api.aandiclub.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mongo
  health:
    livenessstate:
      enabled: true
    mongo:
      enabled: true
    readinessstate:
      enabled: true

security:
  jwt:
    issuer: ${AUTH_ISSUER_URI:http://localhost:9000}
    audience: ${AUTH_AUDIENCE:aandi-gateway}
    secret: ${AUTH_JWT_SECRET:local-dev-jwt-secret-must-be-at-least-32-bytes}
    clock-skew-seconds: ${AUTH_JWT_CLOCK_SKEW_SECONDS:30}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}
  logging:
    v2:
      env: ${APP_ENV:local}
      max-body-bytes: ${APP_V2_LOG_MAX_BODY_BYTES:16384}
      include-path-prefixes: ${APP_V2_LOG_INCLUDE_PATH_PREFIXES:/v2,/api/v2}
      exclude-path-prefixes: ${APP_V2_LOG_EXCLUDE_PATH_PREFIXES:/actuator,/swagger-ui,/v3/api-docs,/favicon.ico,/static,/assets,/webjars}
      service:
        name: ${APP_V2_LOG_SERVICE_NAME:report-service}
        domain-code: ${APP_V2_LOG_DOMAIN_CODE:4}
        version: ${APP_V2_LOG_SERVICE_VERSION:${APP_VERSION:0.0.1-SNAPSHOT}}
        instance-id: ${APP_V2_LOG_INSTANCE_ID:${HOSTNAME:report-service-local}}
  events:
    report-test-case:
      enabled: ${APP_EVENTS_REPORT_TEST_CASE_ENABLED:false}
      topic-arn: ${APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN:}
      region: ${APP_EVENTS_REPORT_TEST_CASE_REGION:ap-northeast-2}
    user-sync:
      enabled: ${APP_EVENTS_USER_SYNC_ENABLED:false}
      queue-url: ${APP_EVENTS_USER_SYNC_QUEUE_URL:}
      region: ${APP_EVENTS_USER_SYNC_REGION:ap-northeast-2}
      wait-time-seconds: ${APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS:20}
      max-number-of-messages: ${APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES:10}
    judge-submission:
      enabled: ${REPORT_JUDGE_SUBMISSION_EVENTS_ENABLED:${APP_EVENTS_JUDGE_SUBMISSION_ENABLED:false}}
      queue-url: ${REPORT_JUDGE_SUBMISSION_EVENTS_QUEUE_URL:${APP_EVENTS_JUDGE_SUBMISSION_QUEUE_URL:}}
      region: ${AWS_REGION:${APP_EVENTS_JUDGE_SUBMISSION_REGION:}}
      wait-time-seconds: ${REPORT_JUDGE_SUBMISSION_EVENTS_WAIT_TIME_SECONDS:${APP_EVENTS_JUDGE_SUBMISSION_WAIT_TIME_SECONDS:20}}
      max-number-of-messages: ${REPORT_JUDGE_SUBMISSION_EVENTS_MAX_MESSAGES:${APP_EVENTS_JUDGE_SUBMISSION_MAX_NUMBER_OF_MESSAGES:10}}
      visibility-timeout-seconds: ${REPORT_JUDGE_SUBMISSION_EVENTS_VISIBILITY_TIMEOUT_SECONDS:${APP_EVENTS_JUDGE_SUBMISSION_VISIBILITY_TIMEOUT_SECONDS:60}}
      poll-delay: ${APP_EVENTS_JUDGE_SUBMISSION_POLL_DELAY:PT1S}
  report:
    v2:
      salt-secret: ${APP_REPORT_V2_SALT_SECRET:}
