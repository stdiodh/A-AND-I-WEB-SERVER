spring:
  application:
    name: aandi_post_web_server
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul

  data:
    mongodb:
      uri: ${MONGO_DB_URL:mongodb://localhost:27017/aandi}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

swagger:
  server:
    url: ${SWAGGER_URL:https://api.aandiclub.com}

security:
  jwt:
    issuer: ${AUTH_ISSUER_URI:http://localhost:9000}
    audience: ${AUTH_AUDIENCE:aandi-gateway}
    secret: ${AUTH_JWT_SECRET:local-dev-jwt-secret-must-be-at-least-32-bytes}
    clock-skew-seconds: ${AUTH_JWT_CLOCK_SKEW_SECONDS:30}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}
  events:
    report-test-case:
      enabled: ${APP_EVENTS_REPORT_TEST_CASE_ENABLED:false}
      topic-arn: ${APP_EVENTS_REPORT_TEST_CASE_SNS_TOPIC_ARN:}
      region: ${APP_EVENTS_REPORT_TEST_CASE_REGION:ap-northeast-2}
    user-sync:
      enabled: ${APP_EVENTS_USER_SYNC_ENABLED:false}
      queue-url: ${APP_EVENTS_USER_SYNC_QUEUE_URL:}
      region: ${APP_EVENTS_USER_SYNC_REGION:ap-northeast-2}
      wait-time-seconds: ${APP_EVENTS_USER_SYNC_WAIT_TIME_SECONDS:20}
      max-number-of-messages: ${APP_EVENTS_USER_SYNC_MAX_NUMBER_OF_MESSAGES:10}
  report:
    v2:
      salt-secret: ${APP_REPORT_V2_SALT_SECRET:}
